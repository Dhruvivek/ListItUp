services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: listitup
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-listitup}
      POSTGRES_DB: listitup
    volumes:
      - listitup-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U listitup"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./client
      target: builder
    command: ["pnpm", "exec", "prisma", "migrate", "deploy"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://listitup:${POSTGRES_PASSWORD:-listitup}@db:5432/listitup?schema=public
    depends_on:
      db:
        condition: service_healthy

  # S3-compatible object storage for Item Attachments (ADR 0002).
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-listitup}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-listitup-minio}
    volumes:
      - listitup-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./client
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://listitup:${POSTGRES_PASSWORD:-listitup}@db:5432/listitup?schema=public
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-listitup}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-listitup-minio}
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy

volumes:
  listitup-db:
  listitup-minio:
